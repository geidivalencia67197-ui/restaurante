<app-formulariobebida></app-formulariobebida>

<section class="container-fluid">

  <h2>Búsqueda</h2>

  <div>
    <label>Buscar por nombre:</label>
    <input type="text" class="form-control d-inline-block"
           placeholder="Nombre de la bebida"
           [(ngModel)]="nombreBusqueda"
           (keyup.enter)="buscarPorNombre()">
    <button class="btn btn-manila" (click)="buscarPorNombre()">Buscar</button>
  </div>

  <br>

  <div>
    <label>Buscar por ingrediente:</label>
    <input type="text" class="form-control d-inline-block"
           placeholder="Ingrediente"
           [(ngModel)]="ingredienteBusqueda"
           (keyup.enter)="buscarPorIngrediente()">
    <button class="btn btn-manila" (click)="buscarPorIngrediente()">Buscar</button>
  </div>

  <br>

  <div>
    <label>Tipo de bebida:</label>
    <select class="form-control d-inline-block" style="width:auto"
            [(ngModel)]="tipoSeleccionado" (change)="filtrarPorTipo()">
      <option value="todos">Todos</option>
      <option value="Alcoholic">Alcohólica</option>
      <option value="Non_Alcoholic">Sin alcohol</option>
    </select>
  </div>

  <br>

  <div>
    <label>Categoría:</label>
    <select class="form-control d-inline-block" style="width:auto"
            [(ngModel)]="categoriaSeleccionada" (change)="filtrarPorCategoria()">
      <option value="todas">Todas</option>
      <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
    </select>
  </div>

</section>

<p *ngIf="cargando" class="text-center">Cargando...</p>

<section class="bebidas" *ngIf="!cargando">
  <h1>Menú</h1>
  <p *ngIf="mensajeVacio">{{ mensajeVacio }}</p>

  <div class="bebida" *ngFor="let item of bebidas">
    <h2>{{ item.strDrink }}</h2>
    <p>Ingredientes: {{ getIngredientes(item) }}</p>
    <p>Precio: ${{ getPrecio(item.idDrink) | number }}</p>
    <img [src]="item.strDrinkThumb" [alt]="item.strDrink">

    <button class="btn btn-manila" (click)="agregarAlCarrito(item)">
      Añadir al carrito
    </button>
  </div>
</section>
